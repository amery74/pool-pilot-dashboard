name: Release v1.4.4

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag v1.4.4
          git push origin v1.4.4
          gh release create v1.4.4 --title "V1.4.4" --notes "Auto-liaison robuste des entités internes Pool Pilot via les métadonnées exposées directement dans hass.states. Le registre Home Assistant reste disponible comme solution de repli pour les anciennes versions de l’intégration. Les entités externes restent au choix de l’utilisateur et les choix manuels restent prioritaires."
