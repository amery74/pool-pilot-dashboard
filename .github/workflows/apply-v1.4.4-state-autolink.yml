name: Apply v1.4.4 state auto-link

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_v144.py
      - name: Validate bundle
        run: |
          node --check pool-pilot-dashboard-card.js
          node --check dist/pool-pilot-dashboard-card.js
          cmp pool-pilot-dashboard-card.js dist/pool-pilot-dashboard-card.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool-pilot-dashboard-card.js dist/pool-pilot-dashboard-card.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: discover Pool Pilot entities from state metadata"
          git push
