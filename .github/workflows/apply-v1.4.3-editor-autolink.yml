name: Apply v1.4.3 editor auto-link

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_v143.py
      - name: Validate bundle
        run: |
          node --check pool-pilot-dashboard-card.js
          node --check dist/pool-pilot-dashboard-card.js
          cmp pool-pilot-dashboard-card.js dist/pool-pilot-dashboard-card.js
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool-pilot-dashboard-card.js dist/pool-pilot-dashboard-card.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: show auto-linked Pool Pilot entities in editor"
          git push
